[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pennywise"
version = "0.1.0"
description = "Terminal agent that categorizes a messy bank CSV and writes a reconciled report"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pennywise = "pennywise.cli:main"

[tool.setuptools]
packages = ["pennywise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real LLM endpoint (run with: pytest -m live)"]
addopts = "-m 'not live'"
